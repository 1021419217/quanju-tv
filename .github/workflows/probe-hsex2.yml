name: Probe hsex detail

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Fetch detail page
        run: |
          UA="Mozilla/5.0 (iPhone; CPU iPhone OS 17_0 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/17.0 Mobile/15E148 Safari/604.1"
          curl -sS -m 30 -A "$UA" "https://hsex.icu/video-1257475.htm" -o d1.html -w "d1 http=%{http_code} bytes=%{size_download}\n"
          echo "=== size"
          wc -c d1.html
          echo "=== m3u8/mp4"
          grep -oE '(https?:)?//[^" <>]*[.](m3u8|mp4)[^" <>]*' d1.html | head -10
          echo "=== video tags"
          grep -oE '<video[^>]*>' d1.html | head -5
          echo "=== source tags"
          grep -oE '<source[^>]*>' d1.html | head -5
          echo "=== script srcs"
          grep -oE '<script[^>]*src="[^"]+"' d1.html | head -15
          echo "=== urls in page"
          grep -oE 'https?://[^" <>]+' d1.html | sort -u | head -40
          echo "=== video_url context"
          grep -oE '.{120}video_url.{200}' d1.html | head -5
      - name: Save artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hsex-detail
          path: d1.html
          if-no-files-found: ignore
          retention-days: 2
