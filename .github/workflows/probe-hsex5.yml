name: Probe hsex search

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Search variants
        run: |
          UA="Mozilla/5.0 (iPhone; CPU iPhone OS 17_0 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/17.0 Mobile/15E148 Safari/604.1"
          try() {
            name="$1"; shift
            curl -sS -m 25 -A "$UA" -G "https://hsex.icu/search.htm" "$@" -o s.html -w "$name http=%{http_code} bytes=%{size_download} " || true
            echo "cards=$(grep -c 'class=\"thumbnail\"' s.html)"
          }
          try "enc-1" --data-urlencode "search=原创" --data-urlencode "sort=new"
          try "enc-2" --data-urlencode "search=原创"
          try "enc-3" --data-urlencode "search=sm" --data-urlencode "sort=new"
          try "enc-4" --data-urlencode "search=" --data-urlencode "sort=new"
          echo "== plain url"
          curl -sS -m 25 -A "$UA" "https://hsex.icu/search.htm?search=%E5%8E%9F%E5%88%9B&sort=new" -o s2.html -w "plain http=%{http_code} bytes=%{size_download}\n" || true
          head -c 300 s2.html || true
          echo
          echo "== category page 2"
          for p in top_list-2.htm top7_list-2.htm 5min_list-2.htm long_list-2.htm; do
            curl -sS -m 25 -A "$UA" "https://hsex.icu/$p" -o c.html -w "$p http=%{http_code} bytes=%{size_download} " || true
            echo "cards=$(grep -c 'class=\"thumbnail\"' c.html)"
          done
