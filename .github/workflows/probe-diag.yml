name: Probe diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Run diagnostic probe
        run: python3 scripts/probe_diag.py 91 kissav hsex
      - name: Save pages
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: probe-pages
          path: |
            /tmp/p91d_*.html
            /tmp/jiuse_*.html
            /tmp/jiuse_p.m3u8
            /tmp/k_*.html
            /tmp/h_*.html
            /tmp/h_p.m3u8
          retention-days: 2
