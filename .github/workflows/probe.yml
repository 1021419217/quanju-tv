name: Probe jiuse cats

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 各分类可播率扫描
        run: |
          set +e
          UA="Mozilla/5.0 (iPhone; CPU iPhone OS 17_0 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/17.0 Mobile/15E148 Safari/604.1"
          SITE=https://91porny.com

          scan() { # $1 名称  $2 URL  $3 抽样数
            curl -sSL -m 30 -A "$UA" "$2" -o /tmp/s.html -w "  http=%{http_code} bytes=%{size_download} "
            grep -oE 'href="/video/view/[0-9a-f]{20,24}"' /tmp/s.html | sed -E 's#.*view/([0-9a-f]+).*#\1#' | awk '!s[$0]++' | head -"$3" > /tmp/ks.txt
            OK=0; BAD=0; MISS=0
            while read -r K; do
              [ -z "$K" ] && continue
              curl -sSL -m 20 -A "$UA" -e "$SITE/" "$SITE/video/view/$K" -o /tmp/sd.html
              SRC=$(grep -oE 'data-src="[^"]+\.m3u8[^"]*"' /tmp/sd.html | head -1 | sed 's/data-src="//;s/"$//')
              if [ -z "$SRC" ]; then MISS=$((MISS+1)); continue; fi
              curl -sS -m 15 -A "$UA" -e "$SITE/video/view/$K" -D /tmp/sh.txt -o /tmp/sm.txt "$SRC"
              if grep -q 'vnotice' /tmp/sm.txt; then BAD=$((BAD+1)); else OK=$((OK+1)); fi
            done < /tmp/ks.txt
            echo "  >>> $1 ok=$OK dead=$BAD nosrc=$MISS"
          }

          for C in most-favorite top-favorite recent-favorite recent-rating month-discuss top-list top-last hot-list latest ori hd nonpaid long-list longer-list; do
            scan "$C" "$SITE/video/category/$C" 3
          done
          scan "most-favorite p2" "$SITE/video/category/most-favorite?page=2" 3
          scan "most-favorite p3" "$SITE/video/category/most-favorite?page=3" 3
          scan "most-favorite p5" "$SITE/video/category/most-favorite?page=5" 3
          scan "搜索 91"          "$SITE/search?keywords=91" 3
          scan "搜索 国产"        "$SITE/search?keywords=%E5%9B%BD%E4%BA%A7" 3
