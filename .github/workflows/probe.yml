name: Probe jiuse card

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 对比可播/不可播卡片标记与备用线路
        run: |
          set +e
          UA="Mozilla/5.0 (iPhone; CPU iPhone OS 17_0 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/17.0 Mobile/15E148 Safari/604.1"
          SITE=https://91porny.com
          DEAD=7dff460579f327b234a2
          LIVE=2c36f7c0bce38d9e1ce9

          curl -sSL -m 30 -A "$UA" "$SITE/video/index" -o /tmp/home.html -w "home http=%{http_code} bytes=%{size_download}\n"
          curl -sSL -m 30 -A "$UA" "$SITE/search?keywords=%E8%87%AA%E6%8B%8D" -o /tmp/search.html -w "search http=%{http_code} bytes=%{size_download}\n"
          curl -sSL -m 30 -A "$UA" "$SITE/video/category/most-favorite" -o /tmp/fav.html -w "fav http=%{http_code} bytes=%{size_download}\n"

          echo "===== 卡片 HTML 对比"
          python3 - "$DEAD" "$LIVE" <<'PY'
          import re,sys
          dead,live=sys.argv[1],sys.argv[2]
          for name,path in [("首页/死链",'/tmp/home.html'),("搜索/活链",'/tmp/search.html'),("收藏最多/活链",'/tmp/fav.html')]:
              s=open(path,encoding='utf-8',errors='ignore').read()
              for tag,key in [("死",dead),("活",live)]:
                  i=s.find(key)
                  if i<0:
                      print(f"--- {name} {tag} {key}: 未出现")
                      continue
                  start=max(0,i-700); end=min(len(s),i+400)
                  block=s[start:end]
                  block=re.sub(r'\s+',' ',block)
                  print(f"--- {name} {tag} {key}")
                  print(block[:1100])
                  print()
          PY

          echo "===== 死链试备用线路"
          for Q in "" "?server=line1" "?server=line2" "?server=line3"; do
            echo "-- view$Q"
            curl -sSL -m 25 -A "$UA" -e "$SITE/" "$SITE/video/view/$DEAD$Q" -o /tmp/dd.html -w "   http=%{http_code} bytes=%{size_download}\n"
            SRC=$(grep -oE 'data-src="[^"]+\.m3u8[^"]*"' /tmp/dd.html | head -1 | sed 's/data-src="//;s/"$//')
            echo "   src=$SRC"
            [ -n "$SRC" ] && curl -sS -m 20 -A "$UA" -e "$SITE/video/view/$DEAD" -D /tmp/h2.txt -o /tmp/m2.txt "$SRC" && echo "   notice=$(grep -i '^x-video-notice' /tmp/h2.txt | tr -d '\r') segs=$(grep -c '\.ts' /tmp/m2.txt)"
          done

          echo "-- viewhd"
          curl -sSL -m 25 -A "$UA" -e "$SITE/" "$SITE/video/viewhd/$DEAD" -o /tmp/dh.html -w "   http=%{http_code} bytes=%{size_download}\n"
          grep -oE 'data-src="[^"]{0,200}"|<source[^>]{0,200}>|https?://[^"'"'"' ]{10,160}\.m3u8[^"'"'"' ]{0,60}' /tmp/dh.html | head -4

          echo "===== 活链详情页关键差异"
          curl -sSL -m 25 -A "$UA" -e "$SITE/" "$SITE/video/view/$LIVE" -o /tmp/dl.html
          echo "dead bytes=$(wc -c < /tmp/dd.html) live bytes=$(wc -c < /tmp/dl.html)"
          echo "--- dead 页面里 vip/pay 相关 class"
          grep -oE 'class="[^"]{0,60}(vip|Vip|VIP|pay|lock)[^"]{0,40}"' /tmp/dd.html | sort -u | head -8
          echo "--- live 页面里 vip/pay 相关 class"
          grep -oE 'class="[^"]{0,60}(vip|Vip|VIP|pay|lock)[^"]{0,40}"' /tmp/dl.html | sort -u | head -8
