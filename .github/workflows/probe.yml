name: Probe js

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 拆 videoShow.js 找取流接口
        run: |
          python3 - <<'PY'
          import re, ssl, urllib.request
          ctx = ssl.create_default_context(); ctx.check_hostname = False; ctx.verify_mode = ssl.CERT_NONE
          UA = "Mozilla/5.0 (iPhone; CPU iPhone OS 17_0 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/17.0 Mobile/15E148 Safari/604.1"

          def get(url, timeout=25):
              req = urllib.request.Request(url, headers={"User-Agent": UA})
              with urllib.request.urlopen(req, timeout=timeout, context=ctx) as r:
                  return r.read().decode("utf-8", "ignore")

          urls = [
              "https://fastly.jsdelivr.net/gh/9scdn/static@v2.8.1/videoShow.js",
              "https://fastly.jsdelivr.net/gh/9scdn/static@v2.8.1/app.js",
          ]
          for u in urls:
              try:
                  js = get(u)
              except Exception as ex:
                  print("ERR", u, ex); continue
              print(f"===== {u.split('/')[-1]} bytes={len(js)}")
              for pat in [r'["\'](/?[a-zA-Z0-9_\-/]*(?:play|line|server|unlock|vip|source|m3u8|video)[a-zA-Z0-9_\-/]*)["\']']:
                  hits = sorted(set(re.findall(pat, js)))
                  print("  paths:", [h for h in hits if len(h) > 3][:40])
              for kw in ["ajax", "$.post", "$.get", "fetch(", "server", "line", "vip", "member"]:
                  idx = js.find(kw)
                  if idx >= 0:
                      print(f"  [{kw}] ...{js[max(0,idx-120):idx+180]}...".replace("\n", " ")[:320])
          PY
