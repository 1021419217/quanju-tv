name: Probe site

# 临时排障工作流：在 GitHub 云主机（海外 IP、干净网络）上抓站点真实页面。
# 用完即删。
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Probe 91porn
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"
          C="language=cn_CN; ga=1"
          KEY=e7f9b65d89f5238b6211
          echo "===== detail"
          curl -sSL -m 30 -A "$UA" -H "Cookie: $C" "https://91porn.com/view_video.php?viewkey=$KEY" -o d.html -w "http=%{http_code} bytes=%{size_download}\n"
          echo "--- source tags"
          grep -oE "<source[^>]{0,300}>" d.html | head -5
          echo "--- strencode"
          grep -oE "strencode[0-9]*\('[^']{0,400}'\)" d.html | head -5
          echo "--- mp4 mentions"
          grep -oE "https?://[^\"' ]{0,120}\.mp4[^\"' ]{0,80}" d.html | head -5
          echo "--- video url var"
          grep -oE "video_url[^,]{0,200}" d.html | head -3
          echo "===== parse and fetch"
          python3 - <<'PY'
          import re, urllib.parse, subprocess, html
          s = open('d.html', encoding='utf-8', errors='ignore').read()
          cands = []
          for m in re.finditer(r"strencode2\('([^']+)'\)", s):
              raw = m.group(1)
              dec = urllib.parse.unquote(raw)
              dec = html.unescape(dec)
              for u in re.findall(r"https?://[^\"'\s>]+", dec):
                  cands.append(u)
          for u in re.findall(r"https?://[^\"'\s<>]+\.mp4[^\"'\s<>]*", s):
              cands.append(html.unescape(u))
          seen = []
          for c in cands:
              if c not in seen:
                  seen.append(c)
          print("candidates:", len(seen))
          for c in seen[:5]:
              print(" URL:", c[:160])
          open('urls.txt','w').write("\n".join(seen[:5]))
          PY
          echo "===== fetch candidates"
          i=0
          while read -r U; do
            i=$((i+1))
            echo "-- [$i] $(echo "$U" | cut -c1-100)"
            curl -sSLk -m 25 -A "$UA" -e "https://91porn.com/view_video.php?viewkey=$KEY" -H "Range: bytes=0-65535" -D /tmp/hh.txt "$U" -o /tmp/bb.bin -w "  http=%{http_code} bytes=%{size_download} type=%{content_type}\n" || true
            echo "  headers:"; grep -iE "^(HTTP|content-type|content-length|server|x-)" /tmp/hh.txt | head -5 | tr -d "\r"
            head -c 200 /tmp/bb.bin | tr -d '\0' | head -3
          done < urls.txt
