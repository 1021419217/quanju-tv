name: Probe site

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.1'
      - name: Chrome 指纹请求媒体地址
        working-directory: native
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"
          KEY=e7f9b65d89f5238b6211
          REF="https://91porn.com/view_video.php?viewkey=$KEY"
          curl -sSL -m 30 -A "$UA" -H "Cookie: language=cn_CN; ga=1" "$REF" -o /tmp/d.html -w "detail http=%{http_code} bytes=%{size_download}\n"
          SRC=$(grep -oE '<source src="[^"]+"' /tmp/d.html | head -1 | sed 's/<source src="//;s/"$//')
          echo "SRC=$SRC"
          go mod download
          echo "===== h2 strict"
          go run ./cmd/probe "$SRC" "$REF" strict || true
          echo "===== h2 insecure"
          go run ./cmd/probe "$SRC" "$REF" insecure || true
          echo "===== h1 insecure"
          go run ./cmd/probe "$SRC" "$REF" insecure,h1 || true
          echo "===== h1 insecure plain headers"
          go run ./cmd/probe "$SRC" "$REF" insecure,h1,plain || true
          echo "===== jiuse"
          JREF="https://91porny.com/video/view/$KEY"
          curl -sSL -m 30 -A "$UA" "$JREF" -o /tmp/j.html -w "jiuse http=%{http_code} bytes=%{size_download}\n"
          JSRC=$(grep -oE 'data-src="[^"]+"' /tmp/j.html | head -1 | cut -d'"' -f2)
          echo "JSRC=$JSRC"
          go run ./cmd/probe "$JSRC" "$JREF" insecure || true
