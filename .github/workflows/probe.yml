name: Probe site

# 临时排障工作流：在 GitHub 云主机（海外 IP、干净网络）上抓站点真实页面，
# 用来确认结构、分类入口与播放列表返回内容。用完即删。
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Probe 91porny
        run: |
          UA="Mozilla/5.0 (iPhone; CPU iPhone OS 17_0 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/17.0 Mobile/15E148 Safari/604.1"
          B="https://91porny.com"
          probe() {
            SRC="$1"; REF="$2"
            code=$(curl -sSL -m 20 -A "$UA" -e "$REF" -D /tmp/h.txt "$SRC" -o /tmp/b.txt -w "%{http_code}")
            notice=$(grep -i "x-video-notice" /tmp/h.txt | tr -d '\r' | tr '\n' ' ')
            echo "  http=$code bytes=$(stat -c%s /tmp/b.txt) $notice"
            head -8 /tmp/b.txt | tr '\n' ' '; echo
          }
          echo "===== 3 videos x default line"
          for KEY in e7f9b65d89f5238b6211 7dff460579f327b234a2 14c4b87422acad70e067; do
            echo "-- $KEY"
            curl -sSL -m 20 -A "$UA" -e "$B/" "$B/video/view/$KEY" -o /tmp/d.html
            SRC=$(grep -oE 'data-src="[^"]*"' /tmp/d.html | head -1 | cut -d'"' -f2)
            echo "  src=$SRC"
            probe "$SRC" "$B/video/view/$KEY"
          done
          echo "===== line1..3 on first video"
          for L in line1 line2 line3; do
            echo "-- $L"
            curl -sSL -m 20 -A "$UA" -e "$B/" "$B/video/view/e7f9b65d89f5238b6211?server=$L" -o /tmp/l.html
            SRC=$(grep -oE 'data-src="[^"]*"' /tmp/l.html | head -1 | cut -d'"' -f2)
            echo "  src=$SRC"
            probe "$SRC" "$B/video/view/e7f9b65d89f5238b6211"
          done
          echo "===== category page sample"
          curl -sSL -m 20 -A "$UA" "$B/video/category/hot-list" -o /tmp/c.html -w "http=%{http_code} bytes=%{size_download}\n"
          grep -oE 'href="/video/view/[0-9a-f]+"' /tmp/c.html | head -5
          echo "===== p91 main site"
          curl -sSL -m 25 -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36" -H "Cookie: language=cn_CN; ga=1" "$B/../" -o /dev/null -w "unused=%{http_code}\n" || true
          curl -sSL -m 25 -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36" -H "Cookie: language=cn_CN; ga=1" "https://91porn.com/index.php" -o /tmp/p.html -w "p91 home http=%{http_code} bytes=%{size_download}\n"
          grep -oE 'viewkey=[0-9a-f]+' /tmp/p.html | head -3
