name: Probe jiuse lists

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 按来源抽样验证可播比例
        run: |
          set +e
          UA="Mozilla/5.0 (iPhone; CPU iPhone OS 17_0 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/17.0 Mobile/15E148 Safari/604.1"
          SITE=https://91porny.com

          check() { # $1 来源名  $2 列表URL
            echo "########## $1  <$2>"
            curl -sSL -m 30 -A "$UA" "$2" -o /tmp/list.html -w "  list http=%{http_code} bytes=%{size_download}\n"
            grep -oE 'href="/video/view/[0-9a-f]{20,24}"' /tmp/list.html | sed -E 's#.*view/([0-9a-f]+).*#\1#' | awk '!s[$0]++' | head -4 > /tmp/keys.txt
            echo "  keys=$(wc -l < /tmp/keys.txt)"
            while read -r K; do
              [ -z "$K" ] && continue
              curl -sSL -m 25 -A "$UA" -e "$SITE/" "$SITE/video/view/$K" -o /tmp/det.html
              SRC=$(grep -oE 'data-src="[^"]+\.m3u8[^"]*"' /tmp/det.html | head -1 | sed 's/data-src="//;s/"$//')
              VIP=$(grep -coE '开通VIP|VIP会员|仅限VIP|会员专享' /tmp/det.html)
              if [ -z "$SRC" ]; then echo "  $K  NO-SRC vip=$VIP"; continue; fi
              curl -sS -m 20 -A "$UA" -e "$SITE/video/view/$K" -D /tmp/h.txt -o /tmp/m.txt "$SRC"
              NOTICE=$(grep -i '^x-video-notice' /tmp/h.txt | tr -d '\r' | sed 's/^[^:]*: *//')
              SEG=$(grep -c '\.ts' /tmp/m.txt)
              SIZE=$(wc -c < /tmp/m.txt)
              echo "  $K  notice=${NOTICE:-none} segs=$SEG bytes=$SIZE vip=$VIP  host=$(echo "$SRC" | cut -d/ -f3)"
            done < /tmp/keys.txt
          }

          check "首页 page1"        "$SITE/video/index"
          check "首页 page3"        "$SITE/video/index?page=3"
          check "首页 page9"        "$SITE/video/index?page=9"
          check "分类 非付费"        "$SITE/video/category/nonpaid"
          check "分类 91原创"        "$SITE/video/category/ori"
          check "分类 当前最热"      "$SITE/video/category/hot-list"
          check "分类 收藏最多"      "$SITE/video/category/most-favorite"
          check "分类 10分钟以上"    "$SITE/video/category/long-list"
          check "站内搜索 自拍"      "$SITE/search?keywords=%E8%87%AA%E6%8B%8D"
          check "站内搜索 学生"      "$SITE/search?keywords=%E5%AD%A6%E7%94%9F"

          echo "########## Bing 收录链接"
          curl -sSL -m 25 -A "$UA" "https://www.bing.com/search?q=site%3A91porny.com&count=30" -o /tmp/b.html -w "  http=%{http_code} bytes=%{size_download}\n"
          grep -oE 'https://91porny\.com/video/[a-z0-9/_-]{0,60}' /tmp/b.html | sort -u | head -10
