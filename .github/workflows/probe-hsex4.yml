name: Probe hsex stream 2

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Playlist details
        run: |
          UA="Mozilla/5.0 (iPhone; CPU iPhone OS 17_0 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/17.0 Mobile/15E148 Safari/604.1"
          R="https://hsex.icu/video-1257475.htm"
          U="https://cdn.hdcdn.store/1794183362/gM9zuf27KOyEHARK38XJlA/hls/1257475/index.m3u8"
          curl -sS -m 25 -A "$UA" "$U" -o p1.m3u8 -w "list http=%{http_code} bytes=%{size_download}\n" || true
          echo "== playlist"; cat p1.m3u8 || true
          echo "== ts no referer"
          curl -sS -m 25 -A "$UA" "https://cdn.hdcdn.store/1794183362/gM9zuf27KOyEHARK38XJlA/hls/1257475/index0.ts" -o s0.ts -w "ts http=%{http_code} bytes=%{size_download}\n" || true
          echo "== ts with referer"
          curl -sS -m 25 -A "$UA" -e "$R" "https://cdn.hdcdn.store/1794183362/gM9zuf27KOyEHARK38XJlA/hls/1257475/index1.ts" -o s1.ts -w "ts http=%{http_code} bytes=%{size_download}\n" || true
          echo "== second fetch same url"
          curl -sS -m 25 -A "$UA" "$U" -o p2.m3u8 -w "list2 http=%{http_code} bytes=%{size_download}\n" || true
          echo "== compare"; (cmp p1.m3u8 p2.m3u8 && echo SAME) || echo DIFF
      - name: Other videos and pages
        run: |
          UA="Mozilla/5.0 (iPhone; CPU iPhone OS 17_0 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/17.0 Mobile/15E148 Safari/604.1"
          for v in 1257474 1257468 1257450; do
            curl -sS -m 25 -A "$UA" "https://hsex.icu/video-$v.htm" -o v$v.html -w "video-$v http=%{http_code} bytes=%{size_download} " || true
            grep -oE 'src="https://[^"]+[.]m3u8"' v$v.html | head -1 || true
          done
          echo "== pages"
          for p in list-2.htm list-3.htm hot_list-1.htm top_list-1.htm top7_list-1.htm 5min_list-1.htm long_list-1.htm "search.htm?search=%E5%8E%9F%E5%88%9B&sort=new"; do
            curl -sS -m 25 -A "$UA" "https://hsex.icu/$p" -o t.html -w "$p http=%{http_code} bytes=%{size_download} " || true
            echo "cards=$(grep -c 'class=\"thumbnail\"' t.html)"
          done
          echo "== pagination"
          curl -sS -m 25 -A "$UA" "https://hsex.icu/list-1.htm" -o l1.html || true
          grep -oE 'href="[^"]*list-[0-9]+[.]htm"' l1.html | sort -u | tail -12 || true
          echo "== search form"
          grep -oE '<form[^>]*>' l1.html | head -3 || true
          echo "== author page"
          curl -sS -m 25 -A "$UA" "https://hsex.icu/user.htm?author=gxd89697031" -o a1.html -w "author http=%{http_code} bytes=%{size_download} " || true
          echo "cards=$(grep -c 'class=\"thumbnail\"' a1.html)"
