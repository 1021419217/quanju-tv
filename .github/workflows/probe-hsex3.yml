name: Probe hsex stream

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Playlist and segments
        run: |
          UA="Mozilla/5.0 (iPhone; CPU iPhone OS 17_0 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/17.0 Mobile/15E148 Safari/604.1"
          U="https://cdn.hdcdn.store/1794183362/gM9zuf27KOyEHARK38XJlA/hls/1257475/index.m3u8"
          R="https://hsex.icu/video-1257475.htm"
          echo "== no referer"
          curl -sS -m 25 -A "$UA" "$U" -o p0.m3u8 -w "http=%{http_code} bytes=%{size_download}\n"
          echo "== with referer"
          curl -sS -m 25 -A "$UA" -e "$R" "$U" -o p1.m3u8 -w "http=%{http_code} bytes=%{size_download}\n"
          echo "== playlist head"
          head -c 900 p1.m3u8
          echo
          echo "segments=$(grep -c '#EXTINF' p1.m3u8)"
          TS=$(grep -m1 '^http' p1.m3u8)
          echo "== first ts: $TS"
          curl -sS -m 25 -A "$UA" -e "$R" "$TS" -o s1.ts -w "ts http=%{http_code} bytes=%{size_download}\n"
          head -c 60 s1.ts | xxd | head -3
          echo "== range request"
          curl -sS -m 25 -A "$UA" -e "$R" -r 0-1023 "$TS" -o s2.bin -w "range http=%{http_code} bytes=%{size_download}\n"
          KEY=$(grep -oE 'URI="[^"]+"' p1.m3u8 | head -1 | sed 's/URI="//;s/"$//')
          if [ -n "$KEY" ]; then curl -sS -m 20 -A "$UA" -e "$R" "$KEY" -o k.bin -w "key http=%{http_code} bytes=%{size_download}\n"; fi
      - name: List pages
        run: |
          UA="Mozilla/5.0 (iPhone; CPU iPhone OS 17_0 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/17.0 Mobile/15E148 Safari/604.1"
          for p in list-1.htm list-2.htm hot_list-1.htm top_list-1.htm top7_list-1.htm 5min_list-1.htm long_list-1.htm "search.htm?search=%E5%8E%9F%E5%88%9B&sort=new"; do
            curl -sS -m 25 -A "$UA" "https://hsex.icu/$p" -o t.html -w "$p http=%{http_code} bytes=%{size_download} " 
            echo "cards=$(grep -c 'class=\"thumbnail\"' t.html) videos=$(grep -oE 'href="video-[0-9]+\.htm"' t.html | sort -u | wc -l)"
          done
          echo "== pagination hint"
          curl -sS -m 25 -A "$UA" "https://hsex.icu/list-1.htm" -o l1.html
          grep -oE 'href="[a-z0-9_]*-?[0-9]+\.htm"' l1.html | sort -u | tail -20
